services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dukht-app
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://dukht.edadras.com
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:8094:8080"
    volumes:
      - dukht_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dukht
      - edadras
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dukht-queue
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://dukht.edadras.com
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=180"]
    volumes:
      - dukht_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - dukht

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dukht-scheduler
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://dukht.edadras.com
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - dukht_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - dukht

  mysql:
    image: mysql:8.4
    container_name: dukht-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dukht}
      MYSQL_USER: ${DB_USERNAME:-dukht}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dukht_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - dukht

networks:
  dukht:
    name: dukht
    driver: bridge
  edadras:
    external: true
    name: edadras

volumes:
  dukht_mysql:
    name: dukht_mysql
  dukht_storage:
    name: dukht_storage

