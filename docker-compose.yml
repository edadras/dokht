services:
  app:
    build: .
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      RUN_MIGRATIONS: "true"
    ports:
      - "8080:8080"
    volumes:
      - dokht-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  queue:
    build: .
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120"]
    volumes:
      - dokht-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    build: .
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - dokht-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dokht}
      MYSQL_USER: ${DB_USERNAME:-dokht}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dokht-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  dokht-db:
  dokht-storage:

